<title>Label Cropper — Circuitry Shop BD</title>
<meta name="description" content="Crops Steadfast Courier's A4 label export to a print-ready image, branded for Circuitry Shop BD." />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#1C61E7" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Label Cropper" />

<style>
  html, body { margin:0; }
  img { max-width:100%; }
  [hidden] { display:none !important; }
</style>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#F1F3F9;
    --surface:#FFFFFF;
    --surface-2:#E7EBF5;
    --border:#D3D9E8;
    --ink:#161A2B;
    --ink-soft:#5B6178;
    --accent:#1C61E7;
    --accent-strong:#144CBB;
    --shadow: 0 1px 2px rgba(22,26,43,.06), 0 10px 28px rgba(22,26,43,.10);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    padding-inline:14px;
    padding-block:20px 48px;
    display:flex;
    justify-content:center;
  }
  .page{ width:100%; max-width:480px; display:flex; flex-direction:column; gap:16px; }

  .brand-header{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding-top:4px; }
  .brand-header img{ height:44px; width:auto; display:block; }
  .brand-title{
    font-family:'Archivo',sans-serif; font-size:15px; font-weight:700;
    letter-spacing:.02em; color:var(--ink);
  }

  /* --- Upload --- */
  .dropzone{
    padding:34px 18px; display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; cursor:pointer; border:1.5px dashed var(--border); border-radius:16px;
    background:var(--surface); transition:border-color .15s, background .15s;
    box-shadow:var(--shadow);
  }
  .dropzone.drag{ border-color:var(--accent); background:#EAF0FE; }
  .dropzone svg{ width:32px; height:32px; stroke:var(--accent); }
  .dropzone strong{ font-family:'Archivo',sans-serif; font-size:15px; font-weight:700; }
  .dropzone span{ color:var(--ink-soft); font-size:13px; }
  input[type=file]{ display:none; }

  /* --- Workspace --- */
  .workspace{ display:none; flex-direction:column; gap:14px; }
  .workspace.active{ display:flex; }

  .result-view{ display:flex; flex-direction:column; gap:12px; }
  .result-frame{
    background:var(--surface); border-radius:16px; padding:18px;
    display:flex; justify-content:center; box-shadow:var(--shadow);
    min-height:160px; align-items:center;
  }
  .result-frame canvas{
    display:block; width:100%; max-width:340px; height:auto;
    box-shadow:0 2px 14px rgba(22,26,43,.16); border-radius:2px;
  }
  .result-meta{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px;
    color:var(--ink-soft);
  }

  button.primary{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:16px;
    border-radius:12px; padding:16px 18px; cursor:pointer; border:none;
    background:var(--accent); color:#fff; width:100%;
  }
  button.primary:active{ background:var(--accent-strong); }
  button.primary:disabled{ opacity:.5; cursor:default; }

  button.secondary{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:16px;
    border-radius:12px; padding:16px 18px; cursor:pointer; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink); width:100%;
  }
  button.secondary:active{ background:var(--surface-2); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#fff; font-family:'Karla',sans-serif; font-weight:600;
    font-size:13.5px; padding:11px 18px; border-radius:10px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    white-space:nowrap; max-width:90vw; text-align:center; z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{ color:var(--ink-soft); font-size:11.5px; line-height:1.6; text-align:center; }
  footer a{ color:var(--ink-soft); text-decoration:underline; }

  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>

  const $ = (id) => document.getElementById(id);
  const dropzone = $('dropzone'), fileInput = $('fileInput'), workspace = $('workspace');
  const resultCanvas = $('resultCanvas'), resultMeta = $('resultMeta');
  const saveBtn = $('saveBtn'), toastEl = $('toast'), anotherBtn = $('anotherBtn');

  let sourceCanvas = document.createElement('canvas');
  let sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
  let dpi = RENDER_DPI;
  let baseFileName = 'label';

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function mmToPx(mm) { return (mm / 25.4) * dpi; }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

  // ---------- file loading ----------
  ['dragover', 'dragenter'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
  fileInput.addEventListener('change', e => { const f = e.target.files[0]; if (f) handleFile(f); });

  async function handleFile(file) {
    baseFileName = (file.name || 'label').replace(/\.[^.]+$/, '');
    showToast('Cropping…');
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      const buf = await file.arrayBuffer();
      const pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      const page = await pdfDoc.getPage(1);
      const scale = RENDER_DPI / 72;
      const viewport = page.getViewport({ scale });
      dpi = RENDER_DPI;
      sourceCanvas.width = Math.round(viewport.width);
      sourceCanvas.height = Math.round(viewport.height);
      await page.render({ canvasContext: sourceCtx, viewport }).promise;
    } else {
      await renderImageFile(file);
    }
    workspace.classList.add('active');
    dropzone.style.display = 'none';
    await processAndShow();
  }

  function renderImageFile(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        dpi = 300;
        sourceCanvas.width = img.naturalWidth;
        sourceCanvas.height = img.naturalHeight;
        sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
        sourceCtx.drawImage(img, 0, 0);
        URL.revokeObjectURL(img.src);
        resolve();
      };
      img.src = URL.createObjectURL(file);
    });
  }

  // ---------- detection ----------
  function detectContentBBox(threshold) {
    const w = sourceCanvas.width, h = sourceCanvas.height;
    const step = 2;
    const data = sourceCtx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
    for (let y = 0; y < h; y += step) {
      const rowBase = y * w;
      for (let x = 0; x < w; x += step) {
        const i = (rowBase + x) * 4;
        const a = data[i + 3];
        if (a < 10) continue;
        const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (lum < threshold) {
          found = true;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (!found) return null;
    return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
  }

  function computeCropBox() {
    const raw = detectContentBBox(DETECT_THRESHOLD) || { x: 0, y: 0, w: sourceCanvas.width, h: sourceCanvas.height };
    const m = mmToPx(MARGIN_MM);
    let x = raw.x - m, y = raw.y - m;
    let w = raw.w + 2 * m, h = raw.h + 2 * m;

    const curRatio = w / h;
    const cx = x + w / 2, cy = y + h / 2;
    if (curRatio < TARGET_RATIO) { w = h * TARGET_RATIO; } else { h = w / TARGET_RATIO; }
    x = cx - w / 2; y = cy - h / 2;

    x = clamp(x, 0, sourceCanvas.width - 4);
    y = clamp(y, 0, sourceCanvas.height - 4);
    w = clamp(w, 4, sourceCanvas.width - x);
    h = clamp(h, 4, sourceCanvas.height - y);
    return { x, y, w, h };
  }

  // ---------- Circuitry Shop BD logo overlay ----------
  // The logo is loaded from an SVG data URL, so ctx.drawImage rasterizes it fresh
  // at whatever destination size we ask for — no upscale blur, unlike a raster
  // source, which is what lets this fill the available space at full sharpness.
  let logoImgPromise = null;
  function getLogoImg() {
    if (!logoImgPromise) {
      logoImgPromise = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = LOGO_DATA_URL;
      });
    }
    return logoImgPromise;
  }

  // Finds the label's header divider (a near-full-width dark rule near the
  // top) and replaces everything above it — icon and Steadfast's own
  // shop-name/Merchant-ID text alike — with the full logo, sized to fill
  // that entire header width and height.
  async function applyShopLogo(outCanvas) {
    const ctx = outCanvas.getContext('2d');
    const w = outCanvas.width, h = outCanvas.height;
    const data = ctx.getImageData(0, 0, w, h).data;
    const searchEnd = Math.floor(h * 0.30);
    const searchStart = Math.floor(h * 0.05);
    let dividerY = -1;
    for (let y = searchStart; y < searchEnd; y++) {
      let dark = 0;
      const rowBase = y * w;
      for (let x = 0; x < w; x++) {
        const i = (rowBase + x) * 4;
        const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (lum < 120) dark++;
      }
      if (dark / w > 0.75) { dividerY = y; break; }
    }
    if (dividerY < 0) return false;

    const pad = Math.round(h * 0.01);
    const headerH = Math.max(10, dividerY - pad);

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, headerH);

    const logoImg = await getLogoImg();
    const leftPad = Math.round(w * 0.03);
    const rightPad = Math.round(w * 0.03);
    const vPad = Math.round(headerH * 0.08);
    const maxLogoW = w - leftPad - rightPad;
    const maxLogoH = headerH - vPad * 2;
    const scale = Math.min(maxLogoW / logoImg.naturalWidth, maxLogoH / logoImg.naturalHeight);
    const drawW = logoImg.naturalWidth * scale, drawH = logoImg.naturalHeight * scale;
    const lx = Math.round((w - drawW) / 2);
    const ly = Math.round((headerH - drawH) / 2);
    ctx.drawImage(logoImg, lx, ly, drawW, drawH);
    return true;
  }

  // ---------- big tracking number in the blank space below the COD box ----------
  // Reads the actual consignment number back out of the QR code we just cropped
  // (rather than guessing at OCR), so it's always exactly right, then finds the
  // biggest blank white band in the lower half of the label — the gap between
  // the COD box and the footer — and prints it there, large.
  function findBlankBand(ctx, w, h) {
    const searchStart = Math.floor(h * 0.55);
    const searchEnd = Math.floor(h * 0.97);
    const data = ctx.getImageData(0, searchStart, w, searchEnd - searchStart).data;
    const isBlankRow = [];
    for (let y = 0; y < searchEnd - searchStart; y++) {
      let white = 0;
      const rowBase = y * w;
      for (let x = 0; x < w; x++) {
        const i = (rowBase + x) * 4;
        const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (lum > 248) white++;
      }
      isBlankRow.push(white / w > 0.9);
    }
    // Tolerate a thin hairline divider (a run of a few non-blank rows) inside
    // an otherwise blank stretch, so one faint rule doesn't split the band.
    const tolerance = Math.max(2, Math.round(h * 0.003));
    let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0, gapRun = 0;
    for (let y = 0; y < isBlankRow.length; y++) {
      if (isBlankRow[y]) {
        if (curStart < 0) curStart = y;
        curLen = y - curStart + 1;
        gapRun = 0;
      } else if (curStart >= 0 && gapRun < tolerance) {
        gapRun++;
        curLen = y - curStart + 1;
      } else {
        if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
        curStart = -1; curLen = 0; gapRun = 0;
      }
    }
    if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
    if (bestStart < 0) return null;
    return { top: searchStart + bestStart, height: bestLen };
  }

  async function addBigTrackingNumber(outCanvas) {
    const ctx = outCanvas.getContext('2d');
    const w = outCanvas.width, h = outCanvas.height;

    let idText = null;
    try {
      const imgData = ctx.getImageData(0, 0, w, h);
      const result = window.jsQR ? window.jsQR(imgData.data, w, h) : null;
      if (result && result.data) idText = '#' + result.data;
    } catch (e) {}
    if (!idText) return false;

    const band = findBlankBand(ctx, w, h);
    if (!band || band.height < h * 0.035) return false;

    await document.fonts.load('700 48px "IBM Plex Mono"');
    await document.fonts.ready;

    const padY = Math.round(band.height * 0.18);
    const availH = band.height - padY * 2;
    const availW = w * 0.88;
    let size = Math.round(availH);
    ctx.font = `700 ${size}px "IBM Plex Mono"`;
    while (ctx.measureText(idText).width > availW && size > 8) {
      size -= 1;
      ctx.font = `700 ${size}px "IBM Plex Mono"`;
    }
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idText, w / 2, band.top + band.height / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    return true;
  }

  // ---------- process + show ----------
  async function processAndShow() {
    const cropBox = computeCropBox();
    const out = document.createElement('canvas');
    out.width = Math.round(cropBox.w);
    out.height = Math.round(cropBox.h);
    out.getContext('2d').drawImage(
      sourceCanvas,
      cropBox.x, cropBox.y, cropBox.w, cropBox.h,
      0, 0, out.width, out.height
    );
    const placed = await applyShopLogo(out);
    if (!placed) showToast("Couldn't find a header band for the logo — showing without it");
    else toastEl.classList.remove('show');

    await addBigTrackingNumber(out);

    resultCanvas.width = out.width;
    resultCanvas.height = out.height;
    resultCanvas.getContext('2d').drawImage(out, 0, 0);

    const inW = (out.width / dpi).toFixed(2);
    const inH = (out.height / dpi).toFixed(2);
    resultMeta.textContent = `${inW}″ × ${inH}″ · ${out.width}×${out.height}px`;
  }

  // ---------- save ----------
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    const prevLabel = saveBtn.textContent;
    saveBtn.textContent = 'Preparing…';
    try {
      const blob = await new Promise(res => resultCanvas.toBlob(res, 'image/png'));
      if (!blob) throw new Error('render failed');

      const downloads = await (window.claude?.use ? window.claude.use('downloads') : Promise.resolve(null));
      const filename = `${baseFileName}-cropped.png`;
      if (downloads) {
        const result = await downloads.save({ filename, data: blob });
        showToast(result.status === 'delivered' ? 'Sent' : 'Saved — open it from your printer app');
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      }
    } catch (err) {
      if (err && err.code === 'declined') {
        // user said no, nothing to report
      } else {
        showToast('Could not save — try again');
      }
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = prevLabel;
    }
  });

  anotherBtn.addEventListener('click', () => {
    workspace.classList.remove('active');
    dropzone.style.display = '';
    fileInput.value = '';
    resultMeta.textContent = '—';
    resultCanvas.width = 0;
    resultCanvas.height = 0;
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
